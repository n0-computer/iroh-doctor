[package]
name = "iroh-doctor-core"
version = "0.1.0"
edition = "2021"
description = "Shared protocol and diagnostics types for iroh-doctor and iroh-doctor-app"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
blake3 = "1"
bytes = "1"
# `unstable-net-report` gates Endpoint::net_report and the NetReport (Report)
# type, which the diagnostics probe relies on. iroh 1.0 moved both behind this
# feature; they were unconditional in the rc.
iroh = { version = "1.0", features = ["unstable-net-report"] }
iroh-gossip = { version = "0.101", default-features = false, features = ["net"] }
iroh-services = { version = "1.0", default-features = false }
n0-future = "0.3"
postcard = { version = "1", features = ["experimental-derive"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "time", "macros", "rt"] }
