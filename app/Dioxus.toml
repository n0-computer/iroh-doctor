[application]
# Intended display name. NOTE: in dx 0.7.9 this does NOT reach the mobile
# display name — both the iOS CFBundleDisplayName and the Android app_name
# derive from the PascalCased crate name ("IrohDoctorApp"). Verified by rebuild.
# iOS is fixed durably via the CFBundleDisplayName/CFBundleName overrides in
# [ios.plist] below; Android only gets the real name when built through
# scripts/bundle-mobile.sh, which rewrites app_name in the generated project.
name = "iroh doctor"

[bundle]
# Unified bundle id / Android applicationId. Hyphens are illegal in an Android
# package segment, so this is the de-hyphenated form of the old
# `com.number0.iroh-doctor-app`. Used for both iOS and Android.
identifier = "com.number0.irohdoctor"
publisher = "number 0"
# Source app icon; dx generates the per-platform icon sets from this master.
icon = ["assets/icon/icon-master.png"]

[ios]
# Minimum iOS version. In dx 0.7.9 this key is only read for widget extensions
# (dioxus-cli src/build/apple.rs uses it solely in compile_widget_extensions);
# it does NOT reach the main app's Info.plist or the rustc link step. We set it
# anyway for forward compatibility and declare the store-facing minimum via
# MinimumOSVersion in [ios.plist] below. 17.0 matches the binary's actual
# LC_BUILD_VERSION minos, which comes from IPHONEOS_DEPLOYMENT_TARGET=17.0 in
# the workspace .cargo/config.toml, and the actool --minimum-deployment-target
# in scripts/bundle-mobile.sh. Keep all three in sync — a plist minimum below
# the binary's would let the store install on devices where dyld then aborts.
deployment_target = "17.0"

# iOS Info.plist entries injected by `dx` at bundle time.
[ios.plist]
# dx 0.7.9 templates both of these from the PascalCased crate name
# ("IrohDoctorApp"); injecting them here overrides the template so even plain
# `dx build --ios` carries the real name. scripts/bundle-mobile.sh sets the
# same values defensively. Keep in sync with DISPLAY_NAME there.
CFBundleDisplayName = "iroh doctor"
CFBundleName = "iroh doctor"
# dx 0.7.9's Info.plist template has no MinimumOSVersion key and no other way
# to set it, so we inject it here. Keep in sync with deployment_target above.
MinimumOSVersion = "17.0"
# iroh makes direct connections to peers on the local subnet (hole punching).
# Contrary to what this comment used to claim, iOS does NOT gate that QUIC
# unicast traffic behind the local-network permission: device testing
# (n0-computer/hello-iroh-ffi#8) showed direct LAN paths survive with no usage
# string and even with the app's Local Network toggle switched off in Settings.
# The key stays because iOS still lists the app under Settings > Privacy &
# Security > Local Network, where this string is the user-facing explanation,
# and App Store review expects a usage description for anything the system
# flags. NSBonjourServices is intentionally omitted: presets::N0 uses DNS/pkarr
# + relay discovery, not mDNS/Bonjour. mDNS discovery would need that key plus
# the com.apple.developer.networking.multicast entitlement, not just this string.
NSLocalNetworkUsageDescription = "iroh doctor connects directly to peers on your local network to measure connection quality."
# The app uses only standard encryption (QUIC/TLS via rustls), which is exempt
# from U.S. export-compliance documentation. Declaring this skips the prompt at
# every TestFlight/App Store upload. Re-evaluate if non-standard crypto is added.
ITSAppUsesNonExemptEncryption = false

# Android SDK levels. Google Play requires new apps to target a recent API level
# (API 35 / Android 15 as of 2026); dx defaults to 34, which Play would reject.
# minSdk 24 (Android 7.0) covers ~98% of devices and is where adaptive icons and
# the modern WebView the app relies on are reliably available.
[android]
min_sdk = 24
target_sdk = 35
compile_sdk = 35

# INTERNET is hardcoded into dx 0.7.9's AndroidManifest.xml template (dioxus-cli
# assets/android/gen/app/src/main/AndroidManifest.xml.hbs) and covers the bulk
# of what the app does: QUIC to peers/relays, DNS/pkarr lookup, relay HTTPS
# probes, the UPnP/NAT-PMP port-map probe (responses arrive unicast).
#
# ACCESS_NETWORK_STATE is needed on top: iroh_dns reads the system DNS config
# through Android's ConnectivityManager.getActiveNetwork (hickory's resolv
# lookup), which the OS gates behind this permission. Without it iroh logs
#   WARN iroh_dns::dns: Failed to read the system's DNS config, using fallback
#   DNS servers. error=... ACCESS_NETWORK_STATE
# and falls back to hardcoded resolvers - non-fatal, but we want the device's
# real DNS. It is a normal (install-time) permission: declaring it here is the
# whole fix, granted at install with no runtime prompt (requestPermissions only
# applies to dangerous permissions). An earlier note claimed netwatch's
# getifaddrs/ip route reading avoided ConnectivityManager - true for netwatch,
# but the DNS-config read is a separate path that does hit it.
[android.permissions]
"android.permission.ACCESS_NETWORK_STATE" = { description = "Read the active network's DNS configuration." }

# Deliberately omitted, do not cargo-cult them back in (Play flags unused
# permissions): ACCESS_WIFI_STATE + CHANGE_WIFI_MULTICAST_STATE + a MulticastLock
# are only needed to RECEIVE multicast, i.e. mDNS discovery. The endpoint is
# built with iroh presets::N0 (app/src/node/mod.rs bind_endpoint), which does
# DNS/pkarr + relay discovery and no mDNS. Add these, plus a runtime
# MulticastLock, only if mDNS/local discovery ships later.

[web.app]

# HTML title tag content
title = "iroh doctor"

# include `assets` in web platform
[web.resource]

# Additional CSS style files
style = []

# Additional JavaScript files
script = []

[web.resource.dev]

# Javascript code file
# serve: [dev-server] only
script = []
