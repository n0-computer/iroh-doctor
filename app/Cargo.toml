[package]
name = "iroh-doctor-app"
version = "0.1.0"
authors = ["Rae McKelvey <633012+okdistribute@users.noreply.github.com>"]
edition = "2021"

[dependencies]
dioxus = { version = "0.7.1", features = [] }

anyhow = "1"
dirs = "5"
hex = "0.4"
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util"] }
tracing = "0.1"

iroh = "=1.0.0-rc.1"
iroh-base = "=1.0.0-rc.1"
iroh-relay = "=1.0.0-rc.1"
iroh-services = { version = "=1.0.0-rc.1", default-features = false }
portmapper = "0.18"
postcard = { version = "1", features = ["experimental-derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
iroh-blobs = { version = "=0.102.0", default-features = false, features = ["rpc"] }
n0-future = "0.3"
bytes = "1"
iroh-gossip = { version = "=0.100.0", default-features = false, features = ["net"] }
iroh-docs = "=0.100.0"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# rfd has no backend on iOS (no xdg-portal, no NSSavePanel, no UIDocumentPicker
# wrapper) so the crate fails to compile for that target. On iOS we fall back
# to writing the diagnostics zip into the app sandbox.
[target.'cfg(not(target_os = "ios"))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# On iOS a GUI app's stdout is not captured by the unified logging system and
# the rolling log file lands deep in the app sandbox, so neither is reachable
# via `log stream` / Console.app / Xcode. tracing-oslog forwards tracing events
# into `os_log`, where they can be collected from the device. See init_logging.
[target.'cfg(target_os = "ios")'.dependencies]
tracing-oslog = "0.3"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
