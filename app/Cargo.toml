[package]
name = "iroh-doctor-app"
version = "0.1.0"
authors = ["Rae McKelvey <633012+okdistribute@users.noreply.github.com>"]
edition = "2021"

[dependencies]
dioxus = { version = "0.7.1", features = [] }

anyhow = "1"
dirs = "5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"

iroh-doctor-core = { path = "../core" }
iroh = "=1.0.0-rc.1"
iroh-services = { version = "=1.0.0-rc.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
n0-future = "0.3"
bytes = "1"
iroh-gossip = { version = "=0.100.0", default-features = false, features = ["net"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# rfd has no usable backend on the mobile targets: iOS has no xdg-portal /
# NSSavePanel / UIDocumentPicker wrapper, and on Android the xdg-portal backend
# fails to compile entirely. On both we fall back to writing the diagnostics zip
# into the app sandbox (see save_diagnostics_zip), so rfd is desktop-only.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# On iOS a GUI app's stdout is not captured by the unified logging system and
# the rolling log file lands deep in the app sandbox, so neither is reachable
# via `log stream` / Console.app / Xcode. tracing-oslog forwards tracing events
# into `os_log`, where they can be collected from the device. See init_logging.
[target.'cfg(target_os = "ios")'.dependencies]
tracing-oslog = "0.3"
# The Copy button writes through UIPasteboard on iOS instead of the JS
# Clipboard API: when the iOS build runs on an Apple silicon Mac, WebKit's
# navigator.clipboard.writeText resolves ok but only WebKit's private
# pasteboard type crosses the UIPasteboard -> NSPasteboard bridge, so every
# other app sees an empty clipboard. See copy_to_clipboard in src/main.rs.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIPasteboard"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
